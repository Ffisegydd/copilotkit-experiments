[project]
name = "book-review-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "copilotkit==0.1.96",
  # 0.0.44: 0.0.43's clone() passes kwargs copilotkit 0.1.96 rejects (see CopilotKit's langgraph-fastapi example).
  "ag-ui-langgraph[fastapi]==0.0.44",
  "ag-ui-protocol==0.1.22",
  "langchain==1.4.0",
  "langchain-openai==1.1.9",
  "langgraph==1.2.11",
  "openai==1.109.1",
  "psycopg[binary,pool]>=3.2,<4",
  "fastapi>=0.115.5,<1.0.0",
  "uvicorn>=0.29.0,<1.0.0",
  "fastmcp==4.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
